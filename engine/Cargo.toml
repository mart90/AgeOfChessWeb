[package]
name = "goldrush-engine"
version = "0.1.0"
edition = "2021"
description = "Search engine for Goldrush Gambit (native for training-game generation, WASM for the website bot)"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.test]
opt-level = 2
